<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="brand-title">Поэтическая Полка</title>

    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d6efd'><path d='M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.35-.75-2.1-1zM21 18.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z'/></svg>">
</head>
<body class="vintage-app">

<!-- Шапка -->
<header class="app-header border-bottom py-3 mb-4">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-2 brand-block">
            <span class="brand-icon">🖋️</span>
            <div class="clickable-logo">
                <h1 class="brand-title h4 mb-0"> </h1>
                <small class="text-muted small-subtitle"> </small>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2 flex-grow-1 flex-md-grow-0 header-search-box">
            <div class="input-group input-group-sm search-input-wrapper">
                <span class="input-group-text border-0 bg-white">🔍</span>
                <input type="search" id="searchInput" class="form-control border-0 shadow-none" placeholder="Поиск по авторам и строкам...">
                <button class="btn btn-clear-search border-0 bg-white d-none" id="clearSearchBtn" type="button" title="Очистить">✕</button>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2">
            <div class="btn-group btn-group-lg" role="group" id="fontSizeToggle">
                <input type="radio" class="btn-check" name="fontSize" id="fontSmall" value="small">
                <label class="btn btn-outline-secondary py-0 px-2" for="fontSmall" style="font-size: 0.7rem;">A</label>

                <input type="radio" class="btn-check" name="fontSize" id="fontNormal" value="normal" checked>
                <label class="btn btn-outline-secondary py-0 px-2" for="fontNormal" style="font-size: 0.85rem;">A</label>

                <input type="radio" class="btn-check" name="fontSize" id="fontLarge" value="large">
                <label class="btn btn-outline-secondary py-0 px-2" for="fontLarge" style="font-size: 1rem;">A</label>
            </div>
            <div class="btn-group btn-group-lg" role="group" id="columnsToggle">
                <input type="radio" class="btn-check" name="columns" id="col1" value="1" checked>
                <label class="btn btn-outline-secondary py-0 px-2" for="col1" style="font-size: 0.75rem;">1</label>
                <input type="radio" class="btn-check" name="columns" id="col2" value="2">
                <label class="btn btn-outline-secondary py-0 px-2" for="col2" style="font-size: 0.75rem;">2</label>
                <input type="radio" class="btn-check" name="columns" id="col3" value="3">
                <label class="btn btn-outline-secondary py-0 px-2" for="col3" style="font-size: 0.75rem;">3</label>
            </div>
            <button class="btn btn-vintage-outline btn-sm" id="randBtn">
                <span>🎲</span> RAND
            </button>
            <div> </div>
            <button class="btn btn-vintage-outline btn-sm" id="exportBtn">
                <span>↓</span> Экспорт
            </button>
            <button class="btn btn-vintage-outline btn-sm" id="importBtn">
                <span>↑</span> Импорт
            </button>
            <div> </div>
            <button class="btn btn-vintage-outline btn-sm" id="exportEpubBtn">
                <span>↓</span> EPUB
            </button>
            <input type="file" id="importFileInput" accept=".json" class="d-none">
        </div>
    </div>
</header>

<!-- Основной контент -->
<div class="container-fluid px-4">
    <div class="row g-4">

        <!-- Левый сайдбар: Список авторов -->
        <aside class="col-lg-3 col-md-4">
            <div class="authors-sidebar card border-0 shadow-sm">
                <div class="card-header bg-transparent border-bottom py-3">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <span class="sidebar-heading">Авторы <span class="badge rounded-pill bg-accent ms-1" id="authorsCount">0</span></span>
                            <span class="sidebar-heading">•</span>
                            <span class="sidebar-heading">Стихов <span class="badge rounded-pill bg-secondary ms-1" id="postsCount">0</span></span>
                        </div>
                        <button class="btn btn-accent btn-sm rounded-pill px-3" id="addAuthorBtn"><span style="color: white; font-size: 16px;">✚ </span> Автор</button>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <label class="form-label small text-muted mb-0" style="font-size: 0.75rem;">Сортировка:</label>
                        <div class="btn-group btn-group-sm" role="group">
                            <input type="radio" class="btn-check" name="authorSort" id="sortNone" value="none" checked>
                            <label
                                    class="btn btn-outline-secondary py-0 px-2"
                                    for="sortNone"
                                    style="font-size: 0.7rem;"
                                    title="Без сортировки"
                            >—</label>

                            <input type="radio" class="btn-check" name="authorSort" id="sortAZ" value="az">
                            <label
                                    class="btn btn-outline-secondary py-0 px-2"
                                    for="sortAZ"
                                    style="font-size: 0.7rem;"
                                    title="По алфавиту"
                            >А-Я</label>

                            <input type="radio" class="btn-check" name="authorSort" id="sortRecent" value="recent">
                            <label
                                    class="btn btn-outline-secondary py-0 px-2"
                                    for="sortRecent"
                                    style="font-size: 0.7rem;"
                                    title="По дате последнего просмотра"
                            >🕐</label>

                            <input type="radio" class="btn-check" name="authorSort" id="sortLen" value="len">
                            <label
                                    class="btn btn-outline-secondary py-0 px-2"
                                    for="sortLen"
                                    style="font-size: 0.7rem;"
                                    title="По количеству произведений"
                            >📚</label>

                            <input type="radio" class="btn-check" name="authorSort" id="sortBirsday" value="birthday">
                            <label
                                    class="btn btn-outline-secondary py-0 px-2"
                                    for="sortBirsday"
                                    style="font-size: 0.7rem;"
                                    title="По дате рождения"
                            >🎂</label>
                        </div>
                    </div>
                </div>

                <div class="list-group list-group-flush custom-scrollbar" id="authorsList" style="max-height: calc(100vh - 210px); overflow-y: auto;">
                </div>
            </div>
        </aside>

        <!-- Главное поле: Профиль автора и стихи -->
        <main class="col-lg-9 col-md-8">
            <div id="mainContent">
                <!-- Лента стихов -->
                <div class="posts-feed space-y-4">
                    <!-- Карточка стиха -->
                </div>
            </div>
        </main>

    </div>
</div>

<!-- Модальное окно: Автор (Создание / Редактирование) -->
<div class="modal fade" id="authorModal" tabindex="-1" aria-labelledby="authorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom py-3 d-flex justify-content-between align-items-center">
                <h5 class="modal-title font-display fw-bold mb-0" id="authorModalLabel">Автор</h5>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-2 py-1" id="parseClipboardBtn" title="Вставить ФИО и годы из буфера обмена" style="font-size: 0.75rem;">
                        📋 Из буфера
                    </button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
            </div>
            <form id="authorForm">
                <div class="modal-body p-4">
                    <input type="hidden" id="authorId">

                    <div class="row g-3">
                        <!-- Переключатель порядка ФИО -->
                        <div class="col-12">
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <label class="form-label small fw-bold text-muted mb-0">Порядок:</label>
                                <div class="btn-group btn-group-sm" role="group">
                                    <input type="radio" class="btn-check" name="nameOrder" id="nameOrderFIO" value="FIO" checked>
                                    <label class="btn btn-outline-secondary py-0 px-2" for="nameOrderFIO" style="font-size: 0.75rem;">ФИО</label>

                                    <input type="radio" class="btn-check" name="nameOrder" id="nameOrderIFO" value="IFO">
                                    <label class="btn btn-outline-secondary py-0 px-2" for="nameOrderIFO" style="font-size: 0.75rem;">ИФО</label>

                                    <input type="radio" class="btn-check" name="nameOrder" id="nameOrderIOF" value="IOF">
                                    <label class="btn btn-outline-secondary py-0 px-2" for="nameOrderIOF" style="font-size: 0.75rem;">ИОФ</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label for="authorLastName" class="form-label small fw-bold text-muted mb-1">Фамилия *</label>
                            <input type="text" class="form-control" id="authorLastName" required placeholder="Шевченко">
                        </div>
                        <div class="col-md-4">
                            <label for="authorFirstName" class="form-label small fw-bold text-muted mb-1">Имя</label>
                            <input type="text" class="form-control" id="authorFirstName" placeholder="Тарас">
                        </div>
                        <div class="col-md-4">
                            <label for="authorSurName" class="form-label small fw-bold text-muted mb-1">Отчество</label>
                            <input type="text" class="form-control" id="authorSurName" placeholder="Григорьевич">
                        </div>

                        <div class="col-6">
                            <label for="authorBirthYear" class="form-label small fw-bold text-muted mb-1">Год рождения</label>
                            <input type="number" class="form-control" id="authorBirthYear" placeholder="1814">
                        </div>
                        <div class="col-6">
                            <label for="authorDeathYear" class="form-label small fw-bold text-muted mb-1">Год смерти</label>
                            <input type="number" class="form-control" id="authorDeathYear" placeholder="1861">
                        </div>

                        <!-- Блок Фотографии с выбором источника (Файл, URL или Буфер) -->
                        <div class="col-12 mt-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label small fw-bold text-muted mb-0">Фотография автора</label>
                                <div class="btn-group btn-group-sm" role="group">
                                    <input type="radio" class="btn-check" name="photoSourceMode" id="photoModeFile" value="file" checked>
                                    <label class="btn btn-outline-secondary py-0 px-2" for="photoModeFile" style="font-size: 0.75rem;">Файл</label>

                                    <input type="radio" class="btn-check" name="photoSourceMode" id="photoModeUrl" value="url">
                                    <label class="btn btn-outline-secondary py-0 px-2" for="photoModeUrl" style="font-size: 0.75rem;">URL</label>

                                    <input type="radio" class="btn-check" name="photoSourceMode" id="photoModeBuffer" value="buffer">
                                    <label class="btn btn-outline-secondary py-0 px-2" for="photoModeBuffer" style="font-size: 0.75rem;">Буфер</label>
                                </div>
                            </div>

                            <div class="d-flex align-items-center gap-3 mt-2">
                                <div class="position-relative flex-shrink-0">
                                    <img id="authorPhotoPreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23d8c8b8'/><text x='50%' y='55%' font-size='35' text-anchor='middle' dominant-baseline='middle' fill='%235c4a3e'>📷</text></svg>" class="hero-avatar-img" style="width: 70px; height: 70px;" alt="Preview">
                                </div>

                                <div class="flex-grow-1 overflow-hidden">
                                    <!-- 1. Загрузка из файла -->
                                    <div id="photoFileInputContainer">
                                        <input type="file" class="form-control form-control-sm" id="authorPhotoInput" accept="image/*">
                                    </div>

                                    <!-- 2. Загрузка по URL -->
                                    <div id="photoUrlInputContainer" class="d-none">
                                        <div class="input-group input-group-sm">
                                            <input type="url" class="form-control" id="authorPhotoUrlInput" placeholder="https://example.com/photo.jpg">
                                            <button class="btn btn-outline-secondary" type="button" id="loadPhotoFromUrlBtn">Загрузить</button>
                                        </div>
                                    </div>

                                    <!-- 3. Загрузка из Буфера обмена -->
                                    <div id="photoBufferInputContainer" class="d-none">
                                        <button type="button" class="btn btn-sm btn-outline-primary w-100" id="pastePhotoFromBufferBtn">
                                            📋 Вставить изображение из буфера
                                        </button>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center mt-1">
                                        <small class="text-muted" style="font-size: 0.75rem;">Сжимается в JPEG (300x300 px)</small>
                                        <button type="button" class="btn btn-link text-danger p-0 d-none" id="removePhotoBtn" style="font-size: 0.8rem;">Удалить</button>
                                    </div>
                                </div>
                            </div>

                            <input type="hidden" id="authorPhotoBase64">
                        </div>
                    </div>

                </div>
                <div class="modal-footer border-top bg-light py-2 px-4 d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-danger btn-sm d-none" id="deleteAuthorBtn">Удалить автора</button>
                    <div class="ms-auto d-flex gap-2">
                        <button type="button" class="btn btn-vintage-outline btn-sm" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-accent btn-sm rounded-pill px-4">Сохранить</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Модальное окно: Стих (Создание / Редактирование) -->
<div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom py-3">
                <h5 class="modal-title font-display fw-bold mb-0" id="postModalLabel">Произведение</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <form id="postForm">
                <div class="modal-body p-4">
                    <input type="hidden" id="postId">
                    <input type="hidden" id="postAuthorId">

                    <div class="row g-3">
                        <!-- Поле выбора автора с поиском -->
                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted mb-1">Автор</label>
                            <div class="author-search-wrapper position-relative">
                                <input type="text" class="form-control" id="postAuthorSearch" placeholder="Начните вводить имя автора..." autocomplete="off">
                                <div class="author-search-dropdown d-none" id="authorSearchDropdown"></div>
                            </div>
                        </div>

                        <div class="col-md-8">
                            <label for="postTitle" class="form-label small fw-bold text-muted mb-1">Название произведения</label>
                            <input type="text" class="form-control" id="postTitle" placeholder="Если пустое — возьмется первая строка">
                        </div>
                        <div class="col-md-3">
                            <label for="postYear" class="form-label small fw-bold text-muted mb-1">Год написания</label>
                            <input type="number" class="form-control" id="postYear" placeholder="1845">
                        </div>

                        <!-- Переключатель режима ввода текста -->
                        <div class="col-12 mt-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label small fw-bold text-muted mb-0">Текст произведения *</label>
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" id="useHtmlToggle">
                                    <label class="form-check-label small text-muted" for="useHtmlToggle">HTML разметка</label>
                                </div>
                            </div>

                            <!-- Простой текст -->
                            <div id="plainTextContainer">
                                <textarea class="form-control font-serif" id="postContent" rows="10" placeholder="Як умру, то поховайте..."></textarea>
                            </div>

                            <!-- HTML разметка -->
                            <div id="htmlTextContainer" class="d-none">
                                <textarea class="form-control font-monospace text-muted" id="postContentHtml" rows="10" style="font-size: 0.85rem;" placeholder="<p>Як умру, то поховайте...<br>Мене на могилі...</p>"></textarea>
                            </div>
                        </div>

                        <!-- Заметка / Исторический контекст -->
                        <div class="col-12 mt-3">
                            <label for="postNote" class="form-label small fw-bold text-muted mb-1">Заметка / Контекст (💡)</label>
                            <textarea class="form-control" id="postNote" rows="2" placeholder="Написано во время болезни в Переяславе..."></textarea>
                        </div>

                        <!-- Динамические внешние ссылки -->
                        <div class="col-12 mt-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="form-label small fw-bold text-muted mb-0">Внешние ссылки / Источники</label>
                                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-0 px-2" id="addLinkRowBtn" style="font-size: 0.8rem;">
                                    <span style="color: #888888; font-size: 16px;">✚ </span> Ссылка</button>
                            </div>
                            <div id="linksListContainer" class="d-flex flex-column gap-2">
                                <!-- Динамические строки ссылок будут вставляться сюда -->
                            </div>
                        </div>
                    </div>

                </div>
                <div class="modal-footer border-top bg-light py-2 px-4 d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-danger btn-sm d-none" id="deletePostBtn">Удалить стих</button>
                    <div class="ms-auto d-flex gap-2">
                        <button type="button" class="btn btn-vintage-outline btn-sm" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-accent btn-sm rounded-pill px-4">Сохранить</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="node_modules/jquery/dist/jquery.min.js"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/utilities.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</body>
</html>
